<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0b0e1a;color:#e8ecf4;margin:0;padding:12px;max-width:840px;margin-left:auto;margin-right:auto}
.hd{background:#11162a;border:1px solid #2a3352;border-radius:14px;padding:14px;margin-bottom:10px}
.hd h1{margin:0 0 4px;font-size:22px}

.idx{display:flex;gap:8px;overflow-x:auto;margin:10px 0;padding-bottom:2px}

.card.danger{border-left-color:#ef4444;background:#2a1215}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;margin:2px 4px 2px 0;white-space:nowrap}
.b-ok{background:#14532d;color:#bbf7d0}
.b-warn2{background:#713f12;color:#fde68a}
.b-bad{background:#450a0a;color:#fca5a5}
.b-info{background:#1e3a8a;color:#bfdbfe}
.blink{animation:blink 1.1s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.35}}
.price{font-size:22px;font-weight:700;margin:6px 0}
.meta{font-size:13px;color:#aeb7cc;line-height:1.8}

table{width:100%;border-collapse:collapse;font-size:13px;margin:6px 0}
th{color:#8b93a7;text-align:left;padding:6px 4px;border-bottom:1px solid #2a3352;font-weight:600}
td{padding:7px 4px;border-bottom:1px solid #1c2438}

.spin{display:inline-block;width:14px;height:14px;border:2px solid #2a3552;border-top-color:#f5c518;border-radius:50%;animation:sp 1s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
h3.sec{margin:14px 0 6px;font-size:16px}

<script>
function share(){var u=location.href;if(navigator.share){navigator.share({title:"Market Live — Khanh",url:u});}else if(navigator.clipboard){navigator.clipboard.writeText(u);alert("Đã copy link: "+u);}else{alert(u);}}
function unlock(){var v=document.getElementById("pw").value;if(v==="1569"){try{localStorage.setItem("mlk","1");}catch(e){}document.getElementById("lock").style.display="none";}else{document.getElementById("pwerr").textContent="Sai mật khẩu.";}}
(function(){try{if(localStorage.getItem("mlk")==="1"){var l=document.getElementById("lock");if(l)l.style.display="none";}}catch(e){}})();
document.getElementById("pw").addEventListener("keydown",function(e){if(e.key==="Enter")unlock();});
window.addEventListener("scroll",function(){var b=document.getElementById("topbtn");if(b)b.style.display=window.scrollY>400?"block":"none";});
document.querySelectorAll(".tab").forEach(function(b){b.onclick=function(){document.querySelectorAll(".tab").forEach(function(x){x.classList.remove("on");});b.classList.add("on");["shark","scan","watch","sector"].forEach(function(t){document.getElementById("sec-"+t).style.display=(t===b.dataset.t)?"":"none";});};});
var ZONES = [
  {t:"TSLA", lo:355, hi:365, stop:345, tgt:400},
  {t:"NVDA", lo:212, hi:216, stop:205, tgt:243},
  {t:"MRVL", lo:233, hi:238, stop:224, tgt:280},
  {t:"AAPL", lo:330, hi:331, stop:319, tgt:360},
  {t:"MSFT", lo:500, hi:500, stop:487, tgt:560},
  {t:"PLTR", lo:163, hi:170, stop:157, tgt:200},
  {t:"META", lo:680, hi:700, stop:665, tgt:780},
  {t:"GOOGL",lo:338, hi:340, stop:330, tgt:380},
  {t:"AMZN", lo:245, hi:248, stop:237, tgt:280},
  {t:"CRM",  lo:211, hi:218, stop:204, tgt:260},
  {t:"MRNA", lo:188, hi:192, stop:179, tgt:240},
  {t:"ALAB", lo:310, hi:325, stop:300, tgt:360},
  {t:"KLAC", lo:183, hi:186, stop:177, tgt:210},
  {t:"MU",   lo:940, hi:1000, stop:915, tgt:983, sold:"14/10"},
  {t:"AMD",  lo:599, hi:605, stop:584, tgt:658, sold:"14/10"},
  {t:"COIN", lo:190, hi:190, stop:182, tgt:210, sold:"14/10"},
  {t:"TSM",  lo:445, hi:448, stop:437, tgt:470, sold:"14/10"},
  {t:"AMAT", lo:471, hi:475, stop:457, tgt:520, sold:"14/10"},
  {t:"QCOM", lo:185, hi:190, stop:179, tgt:210, sold:"14/10"},
  {t:"HOOD", lo:115, hi:117, stop:110, tgt:130, sold:"14/10"},
  {t:"SNDK", lo:1520,hi:1634, stop:1475,tgt:1700,sold:"12/10"}
];
var EXTRA = ["ORCL","INTC","JPM","GS","XOM","LLY","UNH","WMT","NKE","WDC","STX","CRDO","COHR","ENTG","GEV","VST","HIMS","IREN","ASTS","RKLB","CRWV","SOXL","LAC","UUUU","OKLO","IONQ","MSTR","SHOP","MELI","ABNB","UBER","TMUS","NFLX","AVGO"];
var SECTORS = [["XLK","Big Tech"],["SOXX","Chip"],["XLF","Bank"],["XLV","Dược"],["XLE","Năng lượng"],["XLI","Công nghiệp"],["XLB","Vật liệu"],["XLU","Tiện ích"],["XLRE","BĐS"],["XLC","Viễn thông"],["XLY","Tiêu dùng"],["XLP","Thiết yếu"]];
var CHIP = ["MU","SNDK","WDC","STX","NVDA","AMD","INTC","MRVL","AVGO","QCOM","COHR","ALAB","CRDO","SOXL"];
var IDX = ["SPY","QQQ","DIA","IWM"];
var ALL_SYMS = [];
ZONES.forEach(function(z){ALL_SYMS.push(z.t);});
EXTRA.forEach(function(s){ALL_SYMS.push(s);});
SECTORS.forEach(function(s){ALL_SYMS.push(s[0]);});
IDX.forEach(function(s){ALL_SYMS.push(s);});
ALL_SYMS.push(".VIX");
ALL_SYMS = ALL_SYMS.filter(function(v,i){return ALL_SYMS.indexOf(v)===i;});
function num(v){
  if(v==null) return 0;
  var s=String(v).replace(/,/g,"").trim();
  var m=s.match(/^([\\d.]+)([KMB])?$/i);
  if(!m) return parseFloat(s)||0;
  var u=(m[2]||"").toUpperCase();
  var mult=u==="K"?1e3:u==="M"?1e6:u==="B"?1e9:1;
  return (parseFloat(m[1])||0)*mult;
}
function ptMin(){
  var p=new Intl.DateTimeFormat("en-US",{timeZone:"America/Los_Angeles",hour:"numeric",minute:"numeric",hour12:false}).formatToParts(new Date());
  var h=0,mi=0;p.forEach(function(x){if(x.type==="hour")h=(+x.value)%24;if(x.type==="minute")mi=+x.value;});
  return h*60+mi;
}
function ptTime(){
  return new Date().toLocaleTimeString("vi-VN",{timeZone:"America/Los_Angeles",hour:"2-digit",minute:"2-digit",second:"2-digit"});
}
async function fetchBatch(syms){
  var url="https://quote.cnbc.com/quote-html-webservice/restQuote/symbolType/symbol"
    +"?symbols="+encodeURIComponent(syms.join("|"))
    +"&noform=1&partnerId=2&fund=1&exthrs=1&output=json&requestMethod=quick&extendedMask=1";
  var ctl=new AbortController(),to=setTimeout(function(){ctl.abort();},20000);
  try{
    var r=await fetch(url,{signal:ctl.signal});
    clearTimeout(to);
    if(!r.ok) return [];
    var d=await r.json();
    return (d.FormattedQuoteResult&&d.FormattedQuoteResult.FormattedQuote)||[];
  }catch(e){clearTimeout(to);return [];}
}
async function loadQuotes(){
  var M={},B=24,i,list;
  for(i=0;i<ALL_SYMS.length;i+=B){
    list=await fetchBatch(ALL_SYMS.slice(i,i+B));
    list.forEach(function(q){
      var px=num(q.last);
      if(px>0) M[q.symbol]={price:px,prev:num(q.previous_day_closing),dayLow:num(q.low),vol:num(q.volume),avgVol:num(q.tendayavgvol)};
    });
  }
  if(Object.keys(M).length===0) throw new Error("CNBC trả rỗng");
  return M;
}
function volMult(q){
  if(!q.vol||!q.avgVol) return null;
  var t=ptMin(),open=390,close=780,exp=q.avgVol;
  if(t>=open&&t<=close) exp*=Math.max(.08,(t-open)/(close-open));
  return q.vol/exp;
}
function fmt(n){if(n==null||isNaN(n))return "—";return n>=1000?n.toLocaleString("en-US"):Math.round(n*100)/100;}
function chg(q){return (q.price-q.prev)/q.prev*100;}
function sharkTitle(z,q){
  var P=q.price,vm=volMult(q);
  var R=(z.tgt-P)/(P-z.stop),pct=(z.tgt-P)/P*100;
  var pctTxt=pct>=0?'+'+pct.toFixed(1)+'%':pct.toFixed(1)+'%';
  var sharks="🦈";
  if(vm&&vm>=1.5)sharks+="🦈";
  if(!z.sold&&P>z.stop&&P<=z.hi*1.02&&R>=1.5)sharks+="🦈";
  if(z.sold) return {t:"🔴 "+z.t+" ĐÃ BÁN "+z.sold+" — đang $"+fmt(P)+". Giữ kỷ luật, không bắt lại",cls:" dead",badge:'<span class="badge b-bad">🔴 ĐÃ BÁN</span>'};
  if(P<=z.stop) return {t:"💀 "+z.t+" THỦNG CẮT $"+fmt(z.stop)+" — đang $"+fmt(P)+". KHẨN: bán ngay, thủng là thủng",cls:" danger",badge:'<span class="badge b-bad blink">💀 THỦNG CẮT — KHẨN</span>'};
  if(P<z.lo) return {t:sharks+" "+z.t+" VÙNG RẺ — $"+fmt(P)+" dưới vùng $"+fmt(z.lo)+"–$"+fmt(z.hi)+". R "+R.toFixed(1)+" — càng rẻ R càng ngon",cls:"",badge:'<span class="badge b-ok blink">🟢 CÒN KỊP</span><span class="badge b-info">📈 R '+R.toFixed(1)+'</span>'};
  if(P<=z.hi) return {t:sharks+" "+z.t+" VÀO VÙNG — $"+fmt(P)+", trong vùng $"+fmt(z.lo)+"–$"+fmt(z.hi)+". R "+R.toFixed(1)+", đà còn "+pctTxt+" tới chốt $"+fmt(z.tgt)+" — còn kịp",cls:"",badge:'<span class="badge b-ok blink">🟢 CÒN KỊP</span><span class="badge b-info">📈 R '+R.toFixed(1)+'</span>'};
  if(P<=z.hi*1.02) return {t:sharks+" "+z.t+" SÁT VÙNG — $"+fmt(P)+", trên vùng $"+fmt(z.hi)+" một chút. Đừng đuổi, chờ nó quay lại",cls:"",badge:'<span class="badge b-warn2">🟡 SÁT VÙNG</span><span class="badge b-info">📈 R '+R.toFixed(1)+'</span>'};
  if(R>=2) return {t:sharks+" "+z.t+" CHỜ PULLBACK — $"+fmt(P)+", chạy xa vùng rồi. R "+R.toFixed(1)+" nhưng đuổi là dại",cls:"",badge:'<span class="badge b-warn2">🟡 CHỜ PULLBACK</span><span class="badge b-info">📈 R '+R.toFixed(1)+'</span>'};
  if(R>=1) return {t:sharks+" "+z.t+" KHÔNG ĐUỔI — $"+fmt(P)+". R "+R.toFixed(1)+", đứng ngoài chờ",cls:"",badge:'<span class="badge b-warn2">🟡 KHÔNG ĐUỔI</span><span class="badge b-info">📈 R '+R.toFixed(1)+'</span>'};
  return {t:sharks+" "+z.t+" HẾT ĐÀ — $"+fmt(P)+", R chỉ còn "+R.toFixed(1)+". Tiền để dành kèo khác",cls:"",badge:'<span class="badge b-bad">🔴 HẾT ĐÀ</span><span class="badge b-info">📈 R '+R.toFixed(1)+'</span>'};
}
function sharkCard(z,q){
  var P=q.price,c=chg(q),up=c>=0,vm=volMult(q);
  var vol=vm==null?"":(vm>=1.5?"🔥 vol còn nóng "+vm.toFixed(1)+"x":vm<0.8?"🌫️ vol nguội "+vm.toFixed(1)+"x":"vol "+vm.toFixed(1)+"x");
  var st=sharkTitle(z,q);
  var meta=z.sold?'<div class="meta">không bắt lại dù nó hồi</div>'
    :'<div class="meta">Vùng <b>$'+fmt(z.lo)+'–$'+fmt(z.hi)+'</b> · 🎯 Chốt <b>$'+fmt(z.tgt)+'</b> · 🛑 Cắt <b>$'+fmt(z.stop)+'</b><br>'
    +'💓 Còn sống khi giá &gt; $'+fmt(z.stop)+' · Đà còn <b>'+((z.tgt-P)/P*100>=0?'+':'')+((z.tgt-P)/P*100).toFixed(1)+'%</b> tới chốt'+(vol?'<br>'+vol:'')+'</div>';
  return '<div class="card'+st.cls+'"><div>'+st.badge+'</div>'
    +'<div class="ttl">'+st.t+' <span class="'+(up?"up":"dn")+'" style="font-size:13px">'+(up?"+":"")+c.toFixed(2)+'%</span></div>'
    +meta+'</div>';
}
function sharkScore(z,q){
  if(z.sold) return 3;
  var P=q.price;
  if(P<=z.stop) return 0;
  if(P<=z.hi*1.02) return 1;
  return 2;
}
async function render(){
  try{
    document.getElementById("clock").textContent="Giờ PT: "+ptTime()+" · giá live mỗi 2 phút";
    var M=await loadQuotes();
    var ix="";
    IDX.forEach(function(s){
      var q=M[s];if(!q)return;
      var c=chg(q);
      ix+='<div class="c"><b>'+s+'</b> $'+fmt(q.price)+' <span class="'+(c>=0?"up":"dn")+'">'+(c>=0?"+":"")+c.toFixed(2)+'%</span></div>';
    });
    document.getElementById("idx").innerHTML=ix;
    var vx=M[".VIX"]?M[".VIX"].price:null;
    if(vx){
      var vh;
      if(vx>=25) vh='<div class="banner b-fear">😱 <b>VIX '+vx.toFixed(1)+'</b> — HOẢNG LOẠN → <b>chế độ SĂN ĐÁY</b></div>';
      else if(vx>=15) vh='<div class="banner b-calm">😐 <b>VIX '+vx.toFixed(1)+'</b> — bình tĩnh → đánh theo tín hiệu</div>';
      else vh='<div class="banner b-warn">🤑 <b>VIX '+vx.toFixed(1)+'</b> — hưng phấn → <b>chế độ THẬN TRỌNG</b></div>';
      document.getElementById("vix").innerHTML=vh;
    }
    var cards=[],okCount=0;
    ZONES.forEach(function(z){
      var q=M[z.t];
      if(!q){cards.push({s:4,html:'<div class="card"><div class="price">'+z.t+'</div><div class="err">Chưa có giá '+z.t+'.</div></div>'});return;}
      okCount++;
      cards.push({s:sharkScore(z,q),html:sharkCard(z,q)});
    });
    cards.sort(function(a,b){return a.s-b.s;});
    document.getElementById("sec-shark").innerHTML=cards.map(function(x){return x.html;}).join("");
    var rows=[];
    ZONES.map(function(z){return z.t;}).concat(EXTRA).forEach(function(t){
      var q=M[t];if(!q||!q.dayLow)return;
      var P=q.price,bounce=(P-q.dayLow)/q.dayLow*100,dip=(q.dayLow-q.prev)/q.prev*100,vm=volMult(q);
      var sig="";
      if(bounce>=5&&vm&&vm>=1.5)sig="🔥";
      else if(bounce>=3&&dip<=-4)sig="🔄";
      rows.push({t:t,P:P,bounce:bounce,dip:dip,vm:vm,sig:sig,c:chg(q)});
    });
    rows.sort(function(a,b){return b.bounce-a.bounce;});
    var nChip=rows.slice(0,10).filter(function(r){return CHIP.indexOf(r.t)>=0;}).length;
    document.getElementById("cluster").innerHTML=nChip>=4
      ?'<div class="banner b-warn">⚠️ <b>'+nChip+'/10 tín hiệu mạnh nhất là chip</b> — chung 1 sóng, đây là <b>1 kèo sector</b>. Chia tiền, đừng all-in từng con.</div>':"";
    var sc='<h3 class="sec">🔥 Top bounce lúc này</h3><div class="sub">% hồi từ đáy ngày + vol so bình thường · 🔥 bounce ≥5% & vol ≥1.5x · 🔄 rớt sâu rồi hồi</div>'
      +'<table><tr><th>Mã</th><th>Giá</th><th>Hồi từ đáy</th><th>Vol</th><th>Tín hiệu</th></tr>';
    rows.slice(0,12).forEach(function(r){
      sc+='<tr'+(r.sig?' class="hot"':"")+'><td><b>'+r.t+'</b></td><td>$'+fmt(r.P)+' <span class="'+(r.c>=0?"up":"dn")+'">'+(r.c>=0?"+":"")+r.c.toFixed(1)+'%</span></td><td>+'+r.bounce.toFixed(1)+'%</td><td>'+(r.vm?r.vm.toFixed(1)+"x":"—")+'</td><td>'+(r.sig||'<span class="tag">theo dõi</span>')+'</td></tr>';
    });
    var deepest=rows.slice().sort(function(a,b){return a.dip-b.dip;}).slice(0,3).map(function(r){return r.t+" "+r.dip.toFixed(1)+"%";}).join(" · ");
    document.getElementById("sec-scan").innerHTML=sc+'</table><div class="sub">Đáy ngày rớt sâu nhất: '+deepest+'</div>';
    var w='<h3 class="sec">📋 Sổ anh — giá vs vùng</h3><table><tr><th>Mã</th><th>Giá</th><th>Vùng</th><th>Trạng thái</th></tr>';
    ZONES.forEach(function(z){
      var q=M[z.t];if(!q)return;
      var P=q.price,label;
      if(z.sold)label="🔴 ĐÃ BÁN";
      else if(P<=z.stop)label="💀 THỦNG CẮT";
      else if(P<z.lo)label="🟢 dưới vùng";
      else if(P<=z.hi)label="🟢 TRONG VÙNG";
      else label="🟡 trên vùng";
      w+='<tr><td><b>'+z.t+'</b></td><td>$'+fmt(P)+'</td><td>$'+fmt(z.lo)+'–'+fmt(z.hi)+'</td><td>'+label+'</td></tr>';
    });
    document.getElementById("sec-watch").innerHTML=w+'</table>';
    var sx='<h3 class="sec">🗺️ Sector — tiền đang ở đâu</h3><table><tr><th>Sector</th><th>ETF</th><th>Hôm nay</th></tr>';
    var secRows=[];
    SECTORS.forEach(function(s){
      var q=M[s[0]];if(!q)return;
      secRows.push({etf:s[0],name:s[1],c:chg(q)});
    });
    secRows.sort(function(a,b){return b.c-a.c;});
    secRows.forEach(function(s){
      sx+='<tr><td>'+s.name+'</td><td><b>'+s.etf+'</b></td><td class="'+(s.c>=0?"up":"dn")+'">'+(s.c>=0?"+":"")+s.c.toFixed(2)+'%</td></tr>';
    });
    document.getElementById("sec-sector").innerHTML=sx+'</table>';
    document.getElementById("updated").textContent="Cập nhật: "+ptTime()+" PT · "+okCount+"/"+ZONES.length+" mã vùng có giá";
  }catch(e){
    document.getElementById("sec-shark").innerHTML='<div class="err">Không tải được giá: '+e.message+'. Kiểm tra mạng rồi bấm "Tải bản mới nhất".</div>';
  }
}
render();
setInterval(render,120000);
</script>
